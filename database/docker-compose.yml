# MariaDB para desarrollo. Los valores por defecto son de desarrollo y coinciden con los de
# backend/src/main/resources/application.yml. Para cambiarlos, crea un .env junto a este archivo
# (ver .env.example).
#
#   docker compose up -d      levanta la base (localhost:3307 por defecto)
#   docker compose down       la detiene (los datos quedan en el volumen)
#   docker compose down -v    la detiene y borra los datos
#
# Los scripts .sql / .sh que se pongan en ./init se ejecutan una sola vez, al
# crear la base por primera vez (cuando el volumen esta vacio).
#
# Es independiente de backend/ y frontend/: sin container_name ni redes compartidas, y con un
# nombre de proyecto fijo para no mezclarse con otros proyectos que tengan una carpeta "database".
name: ensamblame-database
services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
      MARIADB_DATABASE: ${DB_NAME:-ensamblame}
      MARIADB_USER: ${DB_USER:-ensamblame}
      MARIADB_PASSWORD: ${DB_PASSWORD:-ensamblame_dev}
      TZ: ${DB_TZ:-America/Santiago}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # Puerto del host poco comun (3307) para no chocar con una MariaDB o MySQL local en el 3306.
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      # "z" reetiqueta la carpeta para SELinux (Fedora, RHEL); sin esto el contenedor no puede leerla.
      - ./init:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
