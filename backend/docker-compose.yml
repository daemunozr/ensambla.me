# API REST (Spring Boot). Se conecta a la MariaDB de ../database, que debe estar
# levantada antes: comparten la red ensamblame-net.
#
#   docker compose up -d --build    construye la imagen y levanta la API (http://localhost:8080)
#   docker compose down             la detiene
services:
  backend:
    build: .
    container_name: ensamblame-backend
    restart: unless-stopped
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ensamblame
      DB_USER: ensamblame
      DB_PASSWORD: ensamblame_dev
      APP_CORS_ORIGEN: http://localhost:5173
    ports:
      - "8080:8080"
    networks:
      - ensamblame-net

networks:
  ensamblame-net:
    external: true
