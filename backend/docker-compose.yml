# API REST (Spring Boot). La imagen se compila dentro de Docker (Maven y JDK 21 incluidos): no hace
# falta tener Java ni Maven instalados. Se conecta a la MariaDB de ../database a traves del host
# (host.docker.internal y el puerto que publica esa base), asi que no depende de redes compartidas ni
# de levantar los proyectos en un orden: si arranca antes que la base, reintenta hasta que este lista.
# Para cambiar puertos o credenciales, crea un .env junto a este archivo (ver .env.example).
#
#   docker compose up -d --build    construye la imagen y levanta la API (http://localhost:8080)
#   docker compose down             la detiene
name: ensamblame-backend
services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3307}
      DB_NAME: ${DB_NAME:-ensamblame}
      DB_USER: ${DB_USER:-ensamblame}
      DB_PASSWORD: ${DB_PASSWORD:-ensamblame_dev}
      # Clave con la que se firman los tokens JWT (minimo 32 caracteres). Este valor es de
      # desarrollo y NO sirve para produccion: se cambia en el .env.
      JWT_SECRET: ${JWT_SECRET:-clave-de-desarrollo-ensamblame-cambiar-en-produccion-0123456789}
      # Origenes del frontend autorizados por CORS: el de Docker (8081) y el de Vite (5173).
      APP_CORS_ORIGEN: ${CORS_ORIGEN:-http://localhost:8081,http://localhost:5173}
      # Swagger UI (http://localhost:8080/swagger-ui.html). Poner false para apagarlo, por ejemplo en produccion.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # Zona horaria de la JVM: fija la fecha y el correlativo de cada boleta. Sin ella, la imagen usa
      # UTC y una compra despues de las 21:00 (hora de Chile) quedaria con la fecha del dia siguiente.
      TZ: ${API_TZ:-America/Santiago}
    extra_hosts:
      # En Linux, host.docker.internal no existe por defecto; en Mac y Windows ya viene definido.
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
